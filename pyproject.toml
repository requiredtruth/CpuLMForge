[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cpulmforge"
version = "0.1.0"
description = "Measured CPU local-model launch profile selector"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "RequiredTruth"}]
[project.scripts]
cpulmforge = "cpulmforge.cli:main"
[tool.setuptools.packages.find]
include = ["cpulmforge*"]
